<!-- Un solo <ng-content>: si estuviera dentro de cada rama, Angular solo proyectaría en la última. -->
<ng-template #cuerpo><ng-content /></ng-template>
<ng-template #tooltip>
  @if (ayuda()) {
    <app-ayuda [texto]="ayuda()" [etiqueta]="etiqueta()" [idTooltip]="idCampo() + '-ayuda'" />
  }
</ng-template>
@if (tipo() === 'grupo') {
  <fieldset class="campo" [attr.aria-describedby]="descripcion()">
    <legend>
      {{ etiqueta() }}
      @if (obligatorio()) {
        <span class="obl" aria-hidden="true">*</span>
      }
      <ng-container [ngTemplateOutlet]="tooltip" />
    </legend>
    <ng-container [ngTemplateOutlet]="cuerpo" />
    @if (mostrarError()) {
      <p class="error" [id]="idCampo() + '-error'" role="alert">{{ mensajeError() }}</p>
    }
  </fieldset>
} @else {
  <div class="campo">
    <div class="fila-etiqueta">
      <label [attr.for]="idCampo()">
        {{ etiqueta() }}
        @if (obligatorio()) {
          <span class="obl" aria-hidden="true">*</span>
          <span class="solo-lectores">(obligatorio)</span>
        }
      </label>
      <ng-container [ngTemplateOutlet]="tooltip" />
    </div>
    <div class="control"><ng-container [ngTemplateOutlet]="cuerpo" /></div>
    @if (mostrarError()) {
      <div class="pie">
        <p class="error" [id]="idCampo() + '-error'" role="alert">{{ mensajeError() }}</p>
      </div>
    }
  </div>
}
