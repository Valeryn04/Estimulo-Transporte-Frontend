<div class="barra-voz no-imprimir" role="region" aria-label="Lectura en voz alta">
  @if (voz.soportado) {
    <button
      type="button"
      class="boton secundario chico"
      [attr.aria-pressed]="voz.activa()"
      aria-keyshortcuts="Alt+Shift+L"
      (click)="voz.alternar()"
    >
      {{ voz.activa() ? 'Desactivar lectura en voz alta' : 'Activar lectura en voz alta' }}
    </button>
    @if (voz.activa()) {
      <span class="estado">Lectura en voz alta activada.</span>
      <button type="button" class="boton secundario chico" (click)="leerPagina()">
        Leer esta página
      </button>
      <button
        type="button"
        class="boton secundario chico"
        [disabled]="!voz.hablando()"
        (click)="voz.detener()"
      >
        Detener la lectura
      </button>
    }
  } @else {
    <p class="nota">
      Este navegador no trae voz para leer en voz alta. Puede usar su lector de pantalla (NVDA,
      JAWS, TalkBack o VoiceOver): el portal está preparado para ellos.
    </p>
  }
</div>
