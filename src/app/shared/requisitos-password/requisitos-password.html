<p class="titulo" id="req-password-titulo">La contraseña debe tener:</p>
<ul aria-labelledby="req-password-titulo">
  @for (r of requisitos(); track r.texto) {
    <li [class.cumple]="r.cumple">
      <span aria-hidden="true">{{ r.cumple ? '✓' : '○' }}</span>
      {{ r.texto }}
      <span class="solo-lectores">{{ r.cumple ? '(cumple)' : '(falta)' }}</span>
    </li>
  }
</ul>
