<div class="corregir">
  @if (!abierto()) {
    @if (exito()) {
      <p class="aviso exito" role="status">{{ exito() }}</p>
    }
    @if (editable()) {
      <button type="button" class="enlace" (click)="abrir()">
        Corregir el documento {{ quien() }}
      </button>
    }
  } @else {
    <form class="panel-corregir" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
      <p class="nota">
        Use esta opción solo si escribió mal el tipo o el número del documento {{ quien() }}.
        Revisaremos que ese documento no esté ya registrado.
      </p>
      <div class="rejilla">
        <app-campo
          [idCampo]="'corregir-tipo-' + persona()"
          etiqueta="Tipo de identificación"
          [control]="form.controls.tipoId"
          [mensajes]="{ required: 'elija una opción de la lista' }"
        >
          <select appCampoControl formControlName="tipoId">
            <option [ngValue]="null" disabled>Seleccione</option>
            @for (t of tipos(); track t.id) {
              <option [ngValue]="t.id">{{ t.codigo }} – {{ t.nombre }}</option>
            }
          </select>
        </app-campo>
        <app-campo
          [idCampo]="'corregir-numero-' + persona()"
          etiqueta="Número de identificación"
          ayuda="Escriba el número sin puntos ni espacios."
          [control]="form.controls.numero"
        >
          <input
            appCampoControl
            type="text"
            formControlName="numero"
            autocomplete="off"
            [attr.inputmode]="modo()"
            maxlength="25"
          />
        </app-campo>
      </div>
      @if (error()) {
        <p class="aviso error" role="alert">{{ error() }}</p>
      }
      <div class="acciones">
        <button type="submit" class="boton" [disabled]="guardando()">
          {{ guardando() ? 'Guardando…' : 'Guardar documento' }}
        </button>
        <button
          type="button"
          class="boton secundario"
          [disabled]="guardando()"
          (click)="cancelar()"
        >
          Cancelar
        </button>
      </div>
    </form>
  }
</div>
