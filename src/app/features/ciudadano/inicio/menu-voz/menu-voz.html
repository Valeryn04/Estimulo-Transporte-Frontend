@if (abierto()) {
  <section class="menu no-imprimir" role="dialog" aria-label="Menú principal por voz">
    <p class="estado" role="status">{{ textoEstado() }}</p>
    <h2 class="pregunta">¿Qué desea hacer?</h2>
    @if (estado() === 'escuchando') {
      <p class="oido" aria-live="polite">Escuché: {{ oido() || '…' }}</p>
    }
    <div class="lista">
      @for (o of opciones; track o.id) {
        <button type="button" class="grande" (click)="elegir(o.id)">
          <span class="numero">{{ o.id }}</span> {{ o.nombre }}
        </button>
      }
    </div>
    <button type="button" class="boton secundario chico" (click)="repetir()">
      Repetir las opciones
    </button>
  </section>
}
