<h1>Cambiar contraseña</h1>

@if (sesion.perfil()?.debeCambiarPassword) {
  <p class="aviso advertencia" role="status">
    Debe crear su contraseña definitiva antes de continuar. No necesita escribir la temporal: ya la
    usó para entrar.
  </p>
}

<form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  @if (pideActual()) {
    <app-campo idCampo="actual" etiqueta="Contraseña actual" [control]="form.controls.actual">
      <input
        appCampoControl
        type="password"
        formControlName="actual"
        autocomplete="current-password"
      />
    </app-campo>
  }

  <app-campo
    idCampo="nueva"
    etiqueta="Contraseña nueva"
    [control]="form.controls.nueva"
    [mensajes]="{ politica: 'no cumple todos los requisitos de la lista' }"
  >
    <input appCampoControl type="password" formControlName="nueva" autocomplete="new-password" />
  </app-campo>
  <app-requisitos-password
    [password]="passwordNueva()"
    [usuario]="sesion.perfil()?.usuario ?? ''"
  />

  <app-campo
    idCampo="confirmacion"
    etiqueta="Confirme la contraseña nueva"
    [control]="form.controls.confirmacion"
    [mensajes]="{ iguales: 'debe ser igual a la contraseña nueva' }"
  >
    <input
      appCampoControl
      type="password"
      formControlName="confirmacion"
      autocomplete="new-password"
    />
  </app-campo>

  @if (error()) {
    <p class="aviso error" role="alert">{{ error() }}</p>
  }

  <div class="acciones">
    <button
      appConfirmar="¿Guardar la nueva contraseña?"
      confirmarTexto="Desde ahora ingresará con ella."
      confirmarBoton="Sí, guardar"
      type="submit"
      class="boton"
      [disabled]="cargando()"
    >
      Guardar contraseña
    </button>
  </div>
</form>
