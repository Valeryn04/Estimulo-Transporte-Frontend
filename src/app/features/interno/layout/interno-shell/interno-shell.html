<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="barra">
  <button
    type="button"
    class="hamburguesa"
    aria-controls="menu-lateral"
    [attr.aria-expanded]="menuAbierto()"
    (click)="alternarMenu()"
  >
    <app-icono nombre="menu" />
    <span class="solo-lectores">{{ menuAbierto() ? 'Ocultar el menú' : 'Mostrar el menú' }}</span>
  </button>
  <div class="marca">
    <a
      class="inicio-enlace"
      routerLink="/interno"
      aria-label="Alcaldía de Barranquilla, Gerencia de Desarrollo Social. Ir al inicio del portal interno"
    >
      <app-lockup-dependencia fondo="oscuro" />
    </a>
    <span class="sistema">Estímulo Social de Transporte<br />Portal interno</span>
  </div>
  <div class="acciones-barra">
    <app-campana />
    <app-menu-usuario (cerrarSesion)="cerrarSesion()" />
  </div>
</header>

<div class="cuerpo">
  @if (esMovil() && menuAbierto()) {
    <div class="velo" aria-hidden="true" (click)="cerrarMenu()"></div>
  }
  <nav
    id="menu-lateral"
    class="menu"
    [class.abierto]="menuAbierto()"
    [attr.inert]="menuAbierto() ? null : ''"
    aria-label="Menú del portal interno"
  >
    <button type="button" class="cerrar-menu" (click)="cerrarMenu()">
      <app-icono nombre="cerrar" />
      <span class="solo-lectores">Cerrar el menú</span>
    </button>
    <a routerLink="/interno" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }"
      >Inicio</a
    >
    @for (g of grupos(); track g.nombre) {
      <p class="grupo">{{ g.nombre }}</p>
      @for (e of g.entradas; track e.ruta) {
        <a
          [routerLink]="e.ruta"
          [class.activo]="e.activa"
          [attr.aria-current]="e.activa ? 'page' : null"
          >{{ e.texto }}</a
        >
      }
    }
  </nav>

  <main id="contenido" tabindex="-1" class="contenido">
    <router-outlet />
  </main>
</div>
