<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ejemplo de página institucional con el portal incrustado</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #142334;
        background: #f4f6f8;
      }
      header.sitio {
        padding: 16px;
        color: #fff;
        background: #142334;
      }
      main {
        max-width: 64rem;
        margin: 0 auto;
        padding: 16px;
      }
      /* El iframe ocupa todo el ancho y toma el alto que le informa el portal: sin barras internas. */
      iframe {
        display: block;
        width: 100%;
        min-height: 480px;
        border: 0;
        background: #fff;
      }
      .nota {
        padding: 8px 12px;
        font-size: 0.9rem;
        background: #fff5dc;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header class="sitio"><strong>Página institucional de ejemplo</strong></header>
    <main>
      <p class="nota">
        Esta página solo sirve para probar la incrustación. Abra
        <code>incrustar-ejemplo.html?destino=http://IP-DEL-PORTAL:4300/</code> para probar con el
        portal en otro origen, como será con la página de la Alcaldía.
      </p>
      <h1>Estímulo Social de Transporte</h1>
      <iframe
        id="portal-estimulo"
        title="Portal del Estímulo Social de Transporte"
        allow="fullscreen"
        loading="lazy"
      ></iframe>
    </main>

    <script>
      // Dirección del portal: por defecto el mismo origen; en producción, la URL pública del portal.
      var destino = new URLSearchParams(location.search).get('destino') || '/';
      var marco = document.getElementById('portal-estimulo');
      marco.src = destino;
      var origenPortal = new URL(destino, location.href).origin;

      window.addEventListener('message', function (evento) {
        // Solo se atiende lo que viene del portal.
        if (evento.origin !== origenPortal || !evento.data) return;
        if (evento.data.tipo === 'estimulo-transporte:altura') {
          marco.style.height = evento.data.altura + 'px';
        }
        if (evento.data.tipo === 'estimulo-transporte:navegacion') {
          // La persona cambió de pantalla: se lleva el portal a la vista.
          marco.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    </script>
  </body>
</html>
